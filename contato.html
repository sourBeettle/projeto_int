<form>
    <h1>Formulário de contato</h1>
    <p id="formtext">Contate nossa equipe para reformular, adicionar ou excluir uma avaliação de algum conteúdo (curso, artigo, livro ou profissional).</p>
    <label for="name">Nome</label>
    <input id="name" name="name" type="text" placeholder="Digite um nome" 
    required minlength="5">
    <br>

    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="Digite um email" 
    required minlength="6">
    <br>

    <label>Conteúdo (a ser tratado) </label>

    
    Livro
    <input id="conteudo" name="conteudo" type="radio" value="livro">
    <br>
   
    Artigo
    <input id="conteudo" name="conteudo" type="radio" value="artigo">
    <br>
    
    Curso
    <input id="conteudo" name="conteudo" type="radio" value="curso">
    <br>

    Profissional
    <input id="conteudo" name="conteudo" type="radio" value="profissional">
    <br>

    <label>Data</label>
    <input id="avaliacao" type="date">

    <label>Mensagem (o motivo do contato)</label>
    <textarea></textarea>

    <button>Enviar</button>

</form>
